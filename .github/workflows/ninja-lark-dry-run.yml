name: Ninja Lark dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ninja-lark-dry-run
  cancel-in-progress: false

jobs:
  inspect-ninja-view:
    name: Verify Lark app access (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect Ninja view without exposing post contents
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ vars.LARK_TABLE_ID }}
          LARK_VIEW_ID: ${{ vars.LARK_VIEW_ID }}
        run: python scripts/lark_ninja_dry_run.py
