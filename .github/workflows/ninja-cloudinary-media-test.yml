name: Ninja Cloudinary media URL test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ninja-cloudinary-media-test
  cancel-in-progress: false

jobs:
  test-media-url:
    name: Test one scheduled Ninja image URL (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch one scheduled image, test public URL, and remove temporary copy
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ vars.LARK_TABLE_ID }}
          LARK_VIEW_ID: ${{ vars.LARK_VIEW_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/lark_ninja_cloudinary_media_test.py
