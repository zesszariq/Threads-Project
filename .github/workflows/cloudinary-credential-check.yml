name: Cloudinary credential check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudinary-credential-check
  cancel-in-progress: false

jobs:
  verify-cloudinary:
    name: Verify Cloudinary API credentials (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Cloudinary credentials
        env:
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/cloudinary_credential_check.py
