name: Threads weekday publisher

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Choose which brand to check or publish"
        type: choice
        options:
          - Ninja
          - A4U
          - Pirate
        default: Ninja
        required: true
      mode:
        description: "Dry-run checks access; publish sends one due post for the selected brand"
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run
        required: true
  schedule:
    - cron: "0 2,3,4,5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: threads-weekday-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Check or publish due brand posts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image compression support
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Check or publish Ninja post
        id: ninja
        if: ${{ github.event_name == 'schedule' || inputs.brand == 'Ninja' }}
        continue-on-error: true
        env:
          PUBLISH_BRAND: Ninja
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ vars.LARK_TABLE_ID }}
          LARK_VIEW_ID: ${{ vars.LARK_VIEW_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN || secrets.THREADS_TOKEN }}
          THREADS_EXPECTED_USERNAME: ${{ vars.THREADS_EXPECTED_USERNAME }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'dry-run' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/lark_ninja_publish.py

      - name: Check or publish A4U post
        id: a4u
        if: ${{ github.event_name == 'schedule' || inputs.brand == 'A4U' }}
        continue-on-error: true
        env:
          PUBLISH_BRAND: A4U
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ vars.LARK_TABLE_ID }}
          LARK_VIEW_ID: ${{ vars.A4U_LARK_VIEW_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.A4U_THREADS_ACCESS_TOKEN }}
          THREADS_EXPECTED_USERNAME: ${{ vars.A4U_THREADS_USERNAME }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'dry-run' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/lark_ninja_publish.py

      - name: Check or publish Pirate post
        id: pirate
        if: ${{ github.event_name == 'schedule' || inputs.brand == 'Pirate' }}
        continue-on-error: true
        env:
          PUBLISH_BRAND: Pirate
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ vars.LARK_TABLE_ID }}
          LARK_VIEW_ID: ${{ vars.PIRATE_LARK_VIEW_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.PIRATE_THREADS_ACCESS_TOKEN }}
          THREADS_EXPECTED_USERNAME: ${{ vars.PIRATE_THREADS_USERNAME }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'dry-run' }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/lark_ninja_publish.py

      - name: Report brand step failures
        if: always()
        env:
          NINJA_RESULT: ${{ steps.ninja.outcome }}
          A4U_RESULT: ${{ steps.a4u.outcome }}
          PIRATE_RESULT: ${{ steps.pirate.outcome }}
        run: |
          failed=0
          for result in "$NINJA_RESULT" "$A4U_RESULT" "$PIRATE_RESULT"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "At least one brand check or publish step failed. Review the brand-specific logs above."
            exit 1
          fi
          echo "All selected brand steps completed successfully."
